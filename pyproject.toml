[project]
name = "mephi-python-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sush1" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
mephi-python-course = "mephi_python_course:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
